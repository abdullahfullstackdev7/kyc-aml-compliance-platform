name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sentinelkyc
          POSTGRES_USER: sentinelkyc
          POSTGRES_PASSWORD: sentinelkyc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelkyc -d sentinelkyc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: sentinelkyc
      POSTGRES_PASSWORD: sentinelkyc
      POSTGRES_DB: sentinelkyc
      DATABASE_URL: postgresql+asyncpg://sentinelkyc:sentinelkyc@localhost:5432/sentinelkyc
      DATABASE_URL_SYNC: postgresql+psycopg2://sentinelkyc:sentinelkyc@localhost:5432/sentinelkyc
      REDIS_URL: redis://localhost:6379/0
      # Dev-only credential for the restricted application role that
      # migration 0004 creates; never a real secret (this Postgres
      # container is thrown away at the end of the CI run).
      APP_DB_PASSWORD: sentinelkyc_app_ci_password
      APP_DATABASE_URL: postgresql+asyncpg://sentinelkyc_app:sentinelkyc_app_ci_password@localhost:5432/sentinelkyc
      APP_DATABASE_URL_SYNC: postgresql+psycopg2://sentinelkyc_app:sentinelkyc_app_ci_password@localhost:5432/sentinelkyc
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check for the long dash character (U+2014)
        run: |
          if grep -rP "\x{2014}" --include='*.py' --include='*.md' --include='*.yml' --include='*.yaml' \
              --exclude-dir='.venv' --exclude-dir='node_modules' --exclude-dir='dataset/raw' .; then
            echo "Found U+2014 (em dash); use a comma, colon, parentheses or hyphen instead."
            exit 1
          fi

      - name: Check for banned informal terms
        run: |
          # A compliance product's docs and code comments are read by
          # auditors and examiners; keep them at the same professional
          # register as the rest of the README (see PROJECT_PLAN.md
          # section 7's "neutral, professional language" requirement).
          if grep -rniP '\b(gonna|wanna|kinda|gotta|lol|omg|tbh|hacky|sketchy)\b' \
              --include='*.py' --include='*.md' --include='*.tsx' --include='*.ts' \
              --exclude-dir='.venv' --exclude-dir='node_modules' --exclude-dir='dataset/raw' .; then
            echo "Found an informal term; use professional, neutral wording instead."
            exit 1
          fi

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy backend/app/services pipelines --ignore-missing-imports

      - name: Generate dev JWT keys and encryption secrets
        run: |
          uv run python infra/scripts/generate_dev_secrets.py | tee /tmp/secrets_output.txt
          grep -E '^(JWT_PRIVATE_KEY_PATH|JWT_PUBLIC_KEY_PATH|ENCRYPTION_MASTER_KEY|BLIND_INDEX_KEY)=' \
            /tmp/secrets_output.txt >> "$GITHUB_ENV"

      - name: Apply migrations
        run: uv run alembic -c alembic.ini upgrade head

      - name: Unit and integration tests
        run: |
          uv run pytest tests/ -v \
            --cov=backend/app/services --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=85
        # Some tests (matching-evaluation recall gate, rescreen candidate
        # lookups) need real OFAC SDN data or a generated ground truth set
        # and skip gracefully when neither is present; ingesting the full
        # ~19k-entity SDN corpus on every CI run is deliberately out of
        # scope here to keep the pipeline fast (see `make seed` for the
        # full local ingestion path used before a release).
