[project]
name = "sentinelkyc"
version = "0.1.0"
description = "SentinelKYC: KYC/AML customer onboarding and sanctions screening platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.8.0",
    "dagster-webserver>=1.8.0",
    "dagster-postgres>=0.24.0",
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "xmlschema>=3.3.0",
    "sqlalchemy>=2.0.30",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "rapidfuzz>=3.9.0",
    "jellyfish>=1.0.0",
    "unidecode>=1.3.8",
    "anyascii>=0.3.2",
    "pycountry>=24.6.1",
    "structlog>=24.1.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=4.7.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "pipelines/sentinelkyc_pipelines"]

[tool.dagster]
module_name = "sentinelkyc_pipelines"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"
