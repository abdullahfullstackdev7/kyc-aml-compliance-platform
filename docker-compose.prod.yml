# Production profile (PROJECT_PLAN.md Phase 11.2): Nginx TLS termination
# via Certbot, non-root application containers, resource limits, nightly
# backups. Deploy alongside docker-compose.yml's postgres/redis services
# (or point POSTGRES_HOST/REDIS_URL at managed instances instead).
#
# This file has not been deployed to a real host in this session - no
# domain, DNS or VM was available to provision TLS against - so treat it
# as a reviewed template, not a verified deployment. See
# docs/runbooks/restoring-from-backup.md for the corresponding restore
# procedure.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /app/tmp
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    command: >
      sh -c "envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - api
      - frontend

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renewal check twice a day, per Certbot's own recommendation; the
    # initial certificate still needs to be issued manually once via
    # `docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d $DOMAIN`.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
    volumes:
      - ./infra/scripts/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c "chmod +x /backup.sh
      && while :; do /backup.sh; sleep 24h; done"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana:/etc/grafana/provisioning/dashboards/sentinelkyc:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  certbot_www:
  certbot_certs:
  backups:
  prometheus_data:
  grafana_data:
